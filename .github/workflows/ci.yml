name: ci
on: [push, pull_request]
jobs:
  fresh-clone-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # The buyer path: clone -> install -> verify -> test.
      - run: pip install -r requirements.txt
      - run: python verify_swarm.py
      - run: python -m pytest tests_medbilling/ -q
  core-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: clone core at main
        run: git clone --depth 1 https://github.com/QuietFireAI/dispatcher-agents.git /tmp/core
      # Fork-drift gate: the vendored dispatcher/ must match core exactly.
      - run: python tools/sync_core.py --core /tmp/core --check
  unarmed-still-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # No pillars installed: the swarm must still route (declared unarmed);
      # nothing in this suite needs a pillar.
      # cryptography is NOT a pillar - signing is core, always required.
      - run: pip install pytest cryptography
      - run: python -m pytest tests_medbilling/ -q
